<html lang="en">
<head>
<meta charset="utf-8">
<title>Hilde in the browser</title>
</head>
<body>
<p>Text, counted and turned into capitals by Hilde in WebAssembly:</p>
<textarea id="text" rows="4" cols="60">Hilde runs in the browser.</textarea>
<p id="result"></p>
<script type="module">
import { loadHilde, textStats } from "./hilde-wasm.js";
const hilde = await loadHilde(await (await fetch("text-stats.wasm")).arrayBuffer());
const area = document.getElementById("text");
const show = () => {
  const r = textStats(hilde, area.value);
  document.getElementById("result").textContent = r.words + " words: " + r.upper;
};
area.addEventListener("input", show);
show();
</script>
</body>
</html>
