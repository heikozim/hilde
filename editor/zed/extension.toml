id = "hilde"
name = "Hilde"
version = "0.1.0"
schema_version = 1
authors = ["Heiko Zimmermann"]
description = "Hilde language support: syntax highlighting, brackets, indentation and outline."
repository = "https://github.com/heikozim/hilde"

# Zed clones the repository at this revision and builds the parser from
# editor/tree-sitter-hilde/src/parser.c.  The revision must contain that
# file: the tag of the release, v1.0.0, holds the grammar as it is here.
[grammars.hilde]
repository = "https://github.com/heikozim/hilde"
rev = "v1.0.0"
path = "editor/tree-sitter-hilde"
