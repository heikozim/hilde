# The three clap programmes of docs/arguments-from-clap.md, built to be run
# against the Hilde programmes they model (scripts/clap-compare/compare.py).
# The versions are locked in Cargo.lock, resolved for rustc 1.85.1.
[package]
name = "clap-compare"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
publish = false

[dependencies]
clap = { version = "4", features = ["env"] }

[workspace]
